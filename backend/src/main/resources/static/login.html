<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLab360 - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #4f46e5;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>SmartLab360</h1>
        </div>

        <p class="subtitle">
            Laboratory Equipment Management System
        </p>

        <div id="message"
             class="message">
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton">

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const messageElement =
        document.getElementById("message");

    const loginButton =
        document.getElementById("loginButton");


    function showMessage(
        message,
        type
    ) {

        messageElement.textContent =
            message;

        messageElement.className =
            "message " + type;

        messageElement.style.display =
            "block";
    }


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                showMessage(
                    "Please enter email and password",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Invalid email or password"
                    );
                }


                /*
                 * ==================================
                 * JWT TOKEN
                 * ==================================
                 */

                localStorage.setItem(
                    "token",
                    data.token
                );


                /*
                 * ==================================
                 * USER INFORMATION
                 * ==================================
                 */

                const userData = {

                    userId: data.userId,

                    name: data.name,

                    email: data.email,

                    role: data.role,

                    token: data.token

                };


                localStorage.setItem(
                    "user",
                    JSON.stringify(userData)
                );


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                /*
                 * ==================================
                 * REDIRECT
                 * ==================================
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    500
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Login failed",
                    "error"
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";
            }

        }
    );

</script>

</body>
</html>
