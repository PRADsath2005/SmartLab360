<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLab360 - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .register-container {
            width: 420px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">SmartLab360</div>

    <div class="subtitle">
        Create your account
    </div>

    <form id="registerForm">

        <div class="form-group">
            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required>
        </div>

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="form-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required>
        </div>

        <div class="form-group">
            <label>Phone</label>

            <input
                type="text"
                id="phone"
                placeholder="Enter phone number"
                required>
        </div>

        <div class="form-group">
            <label>Role</label>

            <select id="role">
                <option value="STUDENT">Student</option>
                <option value="LAB_STAFF">Lab Staff</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const phone =
            document.getElementById("phone").value;

        const role =
            document.getElementById("role").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch(
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        phone: phone,
                        role: role
                    })
                }
            );

            const data = await response.json();

            if (response.ok) {

                message.style.color = "green";

                message.textContent =
                    "Registration successful!";

                document.getElementById(
                    "registerForm"
                ).reset();

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1000);

            } else {

                message.style.color = "red";

                message.textContent =
                    data.message || "Registration failed";
            }

        } catch (error) {

            message.style.color = "red";

            message.textContent =
                "Server connection failed";
        }

    }
);

</script>

</body>
</html>
