<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLab360 - My Bookings</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: white;
            padding: 20px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: #1649a0;
            font-size: 27px;
            font-weight: bold;
        }

        .dashboard-link {
            color: #1649a0;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1250px;
            margin: 45px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 34px;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .card h2 {
            margin-bottom: 25px;
            color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        thead {
            background: #eef2f7;
        }

        th,
        td {
            padding: 16px 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            color: #1e293b;
            font-size: 15px;
        }

        td {
            color: #334155;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .cancelled {
            background: #e5e7eb;
            color: #374151;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 13px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
            font-size: 16px;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 21px;
            }

            .container {
                margin-top: 25px;
            }

            h1 {
                font-size: 28px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            SmartLab360
        </div>

        <a
            href="dashboard.html"
            class="dashboard-link">

            ← Dashboard

        </a>

    </div>


    <!-- MAIN -->

    <div class="container">

        <h1>
            My Booking Requests
        </h1>

        <p class="subtitle">
            View and manage your laboratory equipment booking requests
        </p>


        <div class="card">

            <h2>
                My Bookings
            </h2>


            <div id="loading" class="loading">
                Loading booking requests...
            </div>


            <div id="error" class="error" style="display:none;">
            </div>


            <table
                id="bookingTable"
                style="display:none;">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Equipment</th>

                        <th>Date</th>

                        <th>Start Time</th>

                        <th>End Time</th>

                        <th>Purpose</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="bookingBody">

                </tbody>

            </table>


            <div
                id="empty"
                class="empty"
                style="display:none;">

                No booking requests found.

            </div>

        </div>

    </div>


    <!-- JWT AUTH -->

    <script src="js/auth.js"></script>


    <script>

        // =========================================
        // LOGIN CHECK
        // =========================================

        if (!requireLogin()) {
            throw new Error("User not logged in");
        }


        // =========================================
        // CURRENT USER
        // =========================================

        const user =
            getCurrentUser();


        // =========================================
        // LOAD BOOKINGS
        // =========================================

        async function loadBookings() {

            const loading =
                document.getElementById("loading");

            const error =
                document.getElementById("error");

            const table =
                document.getElementById("bookingTable");

            const empty =
                document.getElementById("empty");

            try {

                if (!user || !user.userId) {

                    throw new Error(
                        "User information not found"
                    );
                }


                // JWT authenticated request

                const response =
                    await authFetch(
                        `/api/bookings/user/${user.userId}`
                    );


                if (!response) {
                    return;
                }


                if (!response.ok) {

                    throw new Error(
                        "Failed to load booking requests"
                    );
                }


                const bookings =
                    await response.json();


                loading.style.display =
                    "none";


                // No bookings

                if (
                    !bookings ||
                    bookings.length === 0
                ) {

                    empty.style.display =
                        "block";

                    return;
                }


                const tbody =
                    document.getElementById(
                        "bookingBody"
                    );


                tbody.innerHTML = "";


                bookings.forEach(
                    booking => {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        // Equipment name

                        const equipmentName =
                            booking.equipment &&
                            booking.equipment.name
                                ? booking.equipment.name
                                : "Unknown";


                        // Status

                        const status =
                            booking.status
                                ? booking.status
                                    .toUpperCase()
                                : "PENDING";


                        let statusClass =
                            "pending";


                        if (
                            status === "APPROVED"
                        ) {

                            statusClass =
                                "approved";

                        } else if (
                            status === "REJECTED"
                        ) {

                            statusClass =
                                "rejected";

                        } else if (
                            status === "CANCELLED"
                        ) {

                            statusClass =
                                "cancelled";
                        }


                        row.innerHTML = `

                            <td>
                                ${booking.id}
                            </td>

                            <td>
                                <strong>
                                    ${equipmentName}
                                </strong>
                            </td>

                            <td>
                                ${booking.bookingDate || "-"}
                            </td>

                            <td>
                                ${booking.startTime || "-"}
                            </td>

                            <td>
                                ${booking.endTime || "-"}
                            </td>

                            <td>
                                ${booking.purpose || "-"}
                            </td>

                            <td>

                                <span
                                    class="status ${statusClass}">

                                    ${status}

                                </span>

                            </td>

                            <td>

                                <button
                                    class="delete-btn"
                                    onclick="deleteBooking(${booking.id})">

                                    Delete

                                </button>

                            </td>
                        `;


                        tbody.appendChild(
                            row
                        );

                    }
                );


                table.style.display =
                    "table";


            } catch (err) {

                console.error(
                    "Booking loading error:",
                    err
                );


                loading.style.display =
                    "none";


                error.style.display =
                    "block";


                error.textContent =
                    "Failed to load booking requests.";
            }
        }


        // =========================================
        // DELETE BOOKING
        // =========================================

        async function deleteBooking(
            bookingId
        ) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this booking?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await authFetch(
                        `/api/bookings/${bookingId}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response) {
                    return;
                }


                const data =
                    await response.json();


                if (response.ok) {

                    alert(
                        data.message ||
                        "Booking deleted successfully"
                    );


                    loadBookings();

                } else {

                    alert(
                        data.message ||
                        "Failed to delete booking"
                    );
                }


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Something went wrong."
                );
            }
        }


        // =========================================
        // INITIAL LOAD
        // =========================================

        loadBookings();

    </script>

</body>

</html>
